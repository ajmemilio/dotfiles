# ai/install.sh configuration. Lines starting with # are ignored. ~ is expanded.
#
# source <dir>        a folder of skills (<dir>/<name>/SKILL.md). Missing folders
#                     are skipped, so work-only sources are safe to list here.
#                     On a name clash, the FIRST source wins.
# skills <tool> <dir> where a tool looks for personal skills
# instructions <tool> <file>  where a tool looks for global always-on instructions
#                     (linked to ai/AGENTS.md only if the file doesn't exist yet)
#
# Check each tool's current docs before enabling a line; paths change.

# source  ~/Workspace/skills/skills      # private work repo (only on the work laptop)
source  @/skills                       # @ = this ai/ folder

skills  claude   ~/.claude/skills
# skills  agents   ~/.agents/skills
# skills  codex    ~/.codex/skills
# skills  gemini   ~/.gemini/skills
# skills  copilot  ~/.copilot/skills
# skills  cursor   ~/.cursor/skills

instructions  claude  ~/.claude/CLAUDE.md
# instructions  codex   ~/.codex/AGENTS.md
# instructions  gemini  ~/.gemini/GEMINI.md
