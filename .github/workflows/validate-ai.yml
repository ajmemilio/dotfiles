name: validate-ai
on:
  pull_request:
    paths: ["ai/**"]
  push:
    branches: [main]
    paths: ["ai/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ai/scripts/validate.py
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck ai/install.sh ai/scripts/*.sh ai/skills/*/scripts/*.sh installs/install_ai.sh
